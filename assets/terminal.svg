<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-label="Terminal: whoami, stack and a deploy pipeline">
  <style>
    .c { font: 400 15px "JetBrains Mono","Fira Code",Consolas,"Courier New",monospace; }
    .p { fill: #fe428e; } .cmd { fill: #f8d847; } .o { fill: #a9fef7; } .ok { fill: #3fd68a; } .dim { fill: #a9fef7; opacity: .55; }
    .bar { font: 400 12px "Segoe UI",Ubuntu,sans-serif; fill: #a9fef7; opacity: .6; }
  </style>
  <rect width="830" height="250" rx="8" fill="#141321"/>
  <rect width="830" height="30" rx="8" fill="#1f1d31"/>
  <rect y="22" width="830" height="8" fill="#1f1d31"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="415" y="19" class="bar" text-anchor="middle">flaviu@cloud: ~</text>

  <defs>
    <!-- Each line is revealed left to right, one after another, like typing. -->
    <clipPath id="l1"><rect x="20" y="42" height="24" width="0"><animate attributeName="width" from="0" to="260" begin="0.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="20" y="66" height="24" width="0"><animate attributeName="width" from="0" to="800" begin="1.4s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="20" y="96" height="24" width="0"><animate attributeName="width" from="0" to="260" begin="2.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="20" y="120" height="24" width="0"><animate attributeName="width" from="0" to="800" begin="3.3s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="20" y="150" height="24" width="0"><animate attributeName="width" from="0" to="360" begin="4.1s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="20" y="174" height="24" width="0"><animate attributeName="width" from="0" to="800" begin="5.5s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="20" y="198" height="24" width="0"><animate attributeName="width" from="0" to="800" begin="7.3s" dur="0.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <text x="24" y="60" class="c" clip-path="url(#l1)"><tspan class="p">➜ ~</tspan> <tspan class="cmd">whoami</tspan></text>
  <text x="24" y="84" class="c o" clip-path="url(#l2)">Flaviu Vanca · Software Engineer · Cloud-Native · Backend · AI-native engineering</text>

  <text x="24" y="114" class="c" clip-path="url(#l3)"><tspan class="p">➜ ~</tspan> <tspan class="cmd">cat stack.txt</tspan></text>
  <text x="24" y="138" class="c o" clip-path="url(#l4)">Java · Spring Boot · Spring Cloud · React/TypeScript · Azure · Terraform · Docker</text>

  <text x="24" y="168" class="c" clip-path="url(#l5)"><tspan class="p">➜ ~</tspan> <tspan class="cmd">./ship.sh --env=prod</tspan></text>
  <text x="24" y="192" class="c" clip-path="url(#l6)"><tspan class="ok">✔</tspan><tspan class="o"> tests  </tspan><tspan class="ok">✔</tspan><tspan class="o"> trivy scan  </tspan><tspan class="ok">✔</tspan><tspan class="o"> cosign sign  </tspan><tspan class="ok">✔</tspan><tspan class="o"> terraform apply  </tspan><tspan class="ok">✔</tspan><tspan class="o"> deployed</tspan></text>
  <text x="24" y="216" class="c dim" clip-path="url(#l7)"># work smart, automate hard.</text>

  <!-- Blinking cursor on the last prompt. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="7.9s" dur="0.01s" fill="freeze"/>
    <text x="24" y="240" class="c p">➜ ~ </text>
    <rect x="68" y="227" width="9" height="17" fill="#f8d847">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="7.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
