name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_languages_card.py
      - scripts/generate_activity_card.py
      - scripts/generate_stack_card.py
      - scripts/generate_rhythm_card.py
      - scripts/common.py
      - .github/workflows/update-languages-card.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional read-only personal access token; includes private repositories.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python scripts/generate_languages_card.py
          python scripts/generate_activity_card.py
          python scripts/generate_stack_card.py
          python scripts/generate_rhythm_card.py

      - name: Commit if changed
        run: |
          git add assets/languages.svg assets/activity.svg assets/stack.svg assets/rhythm.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
